[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "11nov01"
version = "0.1.0"
description = "Python/Flask rewrite of the original Node.js server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "11nov01 Maintainers" },
]
keywords = ["flask", "wsgi", "rewrite", "migration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
]
dependencies = [
    "Flask==3.1.3",
    "Werkzeug==3.1.8",
    "Jinja2==3.1.6",
    "itsdangerous==2.2.0",
    "click==8.3.3",
    "blinker==1.9.0",
    "MarkupSafe==3.0.3",
    "python-dotenv==1.1.1",
    "gunicorn==23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-flask==1.3.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "coverage==7.6.4",
    "ruff==0.7.4",
    "black==25.9.0",
    "responses==0.25.3",
]

[project.urls]
Homepage = ""
Repository = ""

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:flask.*",
    "ignore::DeprecationWarning:werkzeug.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["B011"]
"wsgi.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/__init__.py",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 1
